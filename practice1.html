<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice-task</title>
    <style>
        body{
            box-sizing: border-box;
            margin:0px;
            padding: 0px;
        }
        .main{
            border: 5px solid black;
            border-radius: 10px;
            width:80%;
            margin:10px auto 0px auto;
        } 
        .container{
            display: flex;
            gap: 20px;
            padding: 10px; 
           min-height:90vh;
        }
        .box1{
            /* border: 1px solid black; */
            background-color: gray;
            border-radius: 20px;
            width: 20%;
            /* padding: 400px 50px; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box2{
              /* border: 1px solid black; */
              background-color: bisque;
              border-radius: 20px;
              width: 80%;
              /* padding: 400px 50px; */
              display: flex;
              justify-content: center;
              align-items: center;
        }
        @media screen and (max-width:576px) {
            .container{
                flex-direction: column;
            }
            .box1{
                width: 100%;
                height:200px;
            }
            .box2{
                width: 100%;
                height: 500px;
            }
        }
    </style>
</head>
<body>
   <div class="main">
     <div class="container">
        <div class="box1">Left</div>
        <div class="box2">Right</div>
    </div>
   </div>
</body>
</html>
