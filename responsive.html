<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive-Website</title>
    <style>
        body{
            border: 1px solid seagreen;
            max-width: 1140px;
            margin: 0px auto;
        }
        .img-container{
            display: flex;
            gap: 10px;
        }
        .img-box img{
            width: 100%;
            vertical-align: middle;
            border-radius: 10px;
        }
        .img-box{
            width: 50%;
        }
        @media screen and (max-width:576px) {
           .img-container{
             flex-direction: column;
             gap: 30px;
           }
           .img-box{
            width: 100%;
           }
        }
    </style>
</head>
<body>
    <h2>Responsive Website</h2>
    <header>
        <ol>
            <li>viewport meta tag</li>
            <li>css relative unit</li>
            <li>body max-width and horizontal center</li>
            <li>image fluid</li>
            <li>tow column flex and</li>
            <li>use media query with flex direction column</li>
            <li>multi column:grid layout</li>
            <li>menu responsive:will need java script</li>
        </ol>
    </header>
   <main>
     <div class="img-container">
        <div class="img-box">
            <img src="./images/-food.avif" alt="">
        </div>
        <div class="img-box">
            <img src="./images/rose.jpg" alt="">
        </div>
    </div>
   </main>
</body>
</html>
